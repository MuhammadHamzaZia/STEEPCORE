<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
    <defs>
        <linearGradient id="grad_C" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FF00AA" />
            <stop offset="33%" stop-color="#7A00FF" />
            <stop offset="66%" stop-color="#00E5FF" />
            <stop offset="100%" stop-color="#00FF88" />
        </linearGradient>

        <linearGradient id="grad_S_up" x1="100%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="#FF00AA" />
            <stop offset="100%" stop-color="#7A00FF" />
        </linearGradient>

        <linearGradient id="grad_S_low" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#00E5FF" />
            <stop offset="100%" stop-color="#00FF88" />
        </linearGradient>
    </defs>

    <g>
        <animateTransform
            attributeName="transform"
            type="rotate"
            from="0 250.0 250.0"
            to="360 250.0 250.0"
            dur="3s"
            calcMode="spline"
            keyTimes="0;0.5;1"
            keySplines="0.45 0 0.55 1;0.45 0 0.55 1"
            repeatCount="indefinite" />
        <path d="M 405.88 160.00 A 180.00 180.00 0 1 0 405.88 340.00" fill="none" stroke="url(#grad_C)"
              stroke-width="30" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- inner pair rendered with screen blend + glow so where they swing
         close together their light visually mixes into new colors -->
    <g style="isolation:isolate">
        <g>
            <animateTransform
                attributeName="transform"
                type="rotate"
                from="0 250.0 250.0"
                to="360 250.0 250.0"
                dur="6s"
                calcMode="spline"
                keyTimes="0;0.5;1"
                keySplines="0.45 0 0.55 1;0.45 0 0.55 1"
                repeatCount="indefinite" />

            <g style="mix-blend-mode:screen">
                <animateTransform
                    attributeName="transform"
                    type="rotate"
                    from="0 250.0 204.39"
                    to="360 250.0 204.39"
                    dur="3s"
                    calcMode="spline"
                    keyTimes="0;0.5;1"
                    keySplines="0.45 0 0.55 1;0.45 0 0.55 1"
                    repeatCount="indefinite" />
                <path d="M 314.50 268.89 A 91.22 91.22 0 1 0 158.78 204.39" fill="none" stroke="url(#grad_S_up)"
                      stroke-width="30" stroke-linecap="round" stroke-linejoin="round" />
            </g>

            <g style="mix-blend-mode:screen">
                <animateTransform
                    attributeName="transform"
                    type="rotate"
                    from="360 250.0 295.61"
                    to="0 250.0 295.61"
                    dur="3s"
                    calcMode="spline"
                    keyTimes="0;0.5;1"
                    keySplines="0.45 0 0.55 1;0.45 0 0.55 1"
                    repeatCount="indefinite" />
                <path d="M 185.50 231.11 A 91.22 91.22 0 1 0 341.22 295.61" fill="none" stroke="url(#grad_S_low)"
                      stroke-width="30" stroke-linecap="round" stroke-linejoin="round" />
            </g>
        </g>
    </g>
</svg>